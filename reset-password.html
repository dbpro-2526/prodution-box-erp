<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Box Department ERP | Reset Password</title>
    <meta http-equiv="Cache-Control" content="no-store">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #f4f7fe 0%, #eef2f6 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .box { width: 430px; max-width: 100%; background: #fff; border-radius: 16px; box-shadow: 0 10px 35px rgba(0,0,0,.05); padding: 40px 35px; border: 1px solid #e2e8f0; }
        .logo { text-align: center; margin-bottom: 18px; }
        .logo img { width: 85px; height: 85px; border-radius: 12px; object-fit: cover; }
        .title { text-align: center; font-size: 24px; font-weight: 700; color: #0F4C81; }
        .subtitle { text-align: center; font-size: 13.5px; margin-top: 6px; margin-bottom: 26px; color: #64748b; line-height: 1.5; }
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 8px; color: #334155; }
        .input-group input { width: 100%; height: 48px; border: 1px solid #cbd5e1; border-radius: 10px; padding: 0 14px; font-size: 14px; outline: none; }
        .input-group input:focus { border-color: #0F4C81; box-shadow: 0 0 0 3px rgba(15,76,129,.12); }
        button { width: 100%; height: 48px; border: none; border-radius: 10px; background: #0F4C81; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: .2s; }
        button:hover { background: #0c3d68; }
        button:disabled { opacity: .6; cursor: not-allowed; }
        .msg { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 13.5px; line-height: 1.5; display: none; }
        .msg.show { display: block; }
        .msg.ok { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
        .msg.err { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .link { display: block; text-align: center; margin-top: 20px; font-size: 13.5px; color: #0F4C81; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo"><img src="dblogo.png" alt="Logo"></div>
        <div class="title">Naya Password Set Karein</div>
        <div class="subtitle">Reset link verify ho gaya. Ab apna naya password daalein.</div>

        <form id="resetForm" style="display:none">
            <div class="input-group">
                <label>Naya Password</label>
                <input type="password" id="newPassword" placeholder="Kam se kam 6 characters" autocomplete="new-password">
            </div>
            <div class="input-group">
                <label>Naya Password dobara</label>
                <input type="password" id="confirmPassword" placeholder="Dobara likhein" autocomplete="new-password">
            </div>
            <button type="submit" id="submitBtn"><i class="fa-solid fa-floppy-disk"></i> Password Save Karein</button>
        </form>

        <div class="msg" id="msg"></div>
        <a class="link" href="login.html">← Login page par wapas</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
    (function () {
        var msg = document.getElementById('msg');
        var form = document.getElementById('resetForm');
        function show(text, ok) { msg.innerText = text; msg.className = 'msg show ' + (ok ? 'ok' : 'err'); }

        if (!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY) {
            show('Supabase config load nahi hua. Admin se contact karein.', false);
            return;
        }
        // Is page par recovery token URL me aata hai, isliye detectSessionInUrl ON.
        var client = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
            auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true }
        });

        var hash = window.location.hash || '';
        var search = window.location.search || '';
        var errDesc = '';
        try {
            var hp = new URLSearchParams(hash.replace(/^#/, ''));
            errDesc = hp.get('error_description') || hp.get('error') || '';
        } catch (e) {}

        async function init() {
            if (errDesc) { show('Reset link kaam nahi kar raha (expire ho gaya ya pehle use ho chuka hai). Dubara naya link maangein.', false); return; }
            var params = new URLSearchParams(search);
            var code = params.get('code');
            if (code) {
                try { await client.auth.exchangeCodeForSession(code); } catch (e) {}
            }
            var sess = null;
            for (var i = 0; i < 10; i++) {
                var res = await client.auth.getSession();
                sess = res && res.data && res.data.session;
                if (sess) break;
                await new Promise(function (r) { setTimeout(r, 400); });
            }
            if (sess) {
                form.style.display = 'block';
                document.getElementById('newPassword').focus();
            } else {
                show('Reset link verify nahi hua. Naya link maangein ya Admin se password reset karwayen.', false);
            }
        }
        init();

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            var p1 = document.getElementById('newPassword').value;
            var p2 = document.getElementById('confirmPassword').value;
            if (!p1 || p1.length < 6) { show('Password kam se kam 6 characters ka hona chahiye.', false); return; }
            if (p1 !== p2) { show('Dono password same nahi hain.', false); return; }
            var btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
            try {
                var res = await client.auth.updateUser({ password: p1 });
                if (res.error) throw res.error;
                show('Password badal gaya! Ab login karein.', true);
                form.style.display = 'none';
                setTimeout(function () { window.location.href = 'login.html'; }, 1800);
            } catch (err) {
                show('Password nahi badal paya: ' + ((err && err.message) || 'Unknown'), false);
                btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Password Save Karein';
            }
        });
    })();
    </script>
</body>
</html>
